name: Dependency review

on:
  pull_request:

concurrency:
  group: deps-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install pip-audit
        run: pip install pip-audit

      # actions/dependency-review-action needs GitHub's Dependency graph, which
      # is disabled for this repository, so it fails with "Dependency review is
      # not supported on this repository". pip-audit checks the same Python
      # supply chain against the PyPI/OSV advisory databases instead.
      - name: Audit declared Python dependencies
        run: pip-audit -r requirements-ci.txt --progress-spinner off
